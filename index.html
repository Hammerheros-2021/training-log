<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap">
<style>
html{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}

/* Layout: one narrow column, phone-first, deliberately dark: graphite greys with an orange accent. Sticky tab bar (Dashboard / Check-in / Training / Food / Reports); floating orange Dictate button on every tab. */
:root{
  --bg:#17191C; --surface:#212428; --sunk:#2B2F34; --line:#363B41;
  --fg:#EDEFF1; --muted:#99A1AA; --ink-inv:#FFFFFF;
  --accent:#F28C28; --on-accent:#1A1B1D;
  --s:#5B8DEF; --e:#7AC74F; --h:#3FB8AF; --t:#EE6363; --x:#B07CE0; --r:#6B747E; --o:#8C9BD0;
  --ok:#4CC27A; --warn:#E8C547; --bad:#EE6363; --farm:#C49A6C;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.tabs a{text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0;padding:8px 0;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.banner{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.dnav{display:flex;align-items:center;gap:8px}
.dnav button{background:var(--surface);border:1px solid var(--line);border-radius:9px;width:40px;height:40px;font-size:18px}
.dnav .mid{flex:1;text-align:center}
.dnav .mid b{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.dnav .mid small{color:var(--muted);font-size:12px}
.todaybtn{font-size:12px!important;width:auto!important;padding:0 10px}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.strip button{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden}
.strip button.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.strip .d{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.strip .n{font-family:var(--display);font-size:17px;font-weight:600}
.strip .rd{align-self:stretch;height:4px;margin-top:3px;background:var(--rc,transparent)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.done{background:var(--c)}
.dot.part{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.miss{border-color:var(--bad)}
.dot.rest{border-color:var(--line)}
.dot.pre{opacity:.25}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shead{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 40%,#111));color:var(--ink-inv);padding:14px 16px 12px;display:flex;flex-direction:column;gap:2px}
.shead .meta{font-size:12px;opacity:.9;display:flex;gap:8px;flex-wrap:wrap}
.shead h2{font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05}
.shead .sub{font-size:14px;opacity:.95}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.22);font-size:11px;font-weight:600;letter-spacing:.04em}
.sbody{padding:6px 16px 14px}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.ex:last-child{border-bottom:0}
.ex .tag{font-family:var(--display);font-weight:700;color:var(--c);font-size:16px;min-width:22px}
.ex .nm{font-weight:600;min-width:0}
.ex .cue{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.ex .dose{font-family:var(--display);font-weight:600;font-size:17px;text-align:right}
.note{margin-top:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px}
.note b{color:var(--c)}
details.wu{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.wu summary{padding:10px 0;font-weight:600;font-size:14px;cursor:pointer}
details.wu .ex{padding:7px 0}

/* check-in */
.chead{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chead h2{font-size:24px;font-weight:700;text-transform:uppercase}
.chead .sub{font-size:13px;color:var(--muted)}
.gauge{flex:none;width:64px;height:64px;position:relative}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.chips span{background:var(--sunk);border-radius:99px;padding:3px 10px;font-size:12.5px}
.chips span b{font-weight:600}
.verdict{margin:0 16px 14px;border-radius:10px;padding:10px 12px;font-size:13.5px;border:1px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent)}
.verdict b{color:var(--vc)}
.group{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.group+.group{border-top:1px solid var(--line);padding-top:14px}
.group h4{margin:0;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:-2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags button{background:var(--sunk);border:1px solid transparent;border-radius:99px;padding:6px 12px;font-size:13px}
.tags button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.nig{display:grid;grid-template-columns:1fr auto auto;gap:6px;background:var(--sunk);border-radius:10px;padding:8px}
.nig .full{grid-column:1/-1}
.nig .pr{display:flex;align-items:center;gap:8px}
.nig .pr input{flex:1;accent-color:var(--bad)}
.nig .pr output{font-family:var(--display);font-weight:700;min-width:40px;text-align:right}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;color:var(--fg);min-width:0}
.x{background:transparent;border:1px solid var(--line);border-radius:8px;width:36px;font-size:16px;color:var(--muted)}
.add{align-self:flex-start;background:transparent;border:1px dashed var(--muted);border-radius:9px;padding:7px 12px;font-size:13px;color:var(--fg)}
.extra{display:grid;grid-template-columns:1fr 70px 70px auto;gap:6px;align-items:center}

/* forms */
.form{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.form h3{font-size:20px;text-transform:uppercase;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 0;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.status button[aria-pressed="true"][data-v="done"]{background:var(--ok);color:#fff}
.seg.status button[aria-pressed="true"][data-v="partial"]{background:var(--warn);color:var(--on-accent)}
.seg.status button[aria-pressed="true"][data-v="missed"]{background:var(--bad);color:#fff}
.seg.small button{font-size:12.5px;padding:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=number],input[type=text],textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;border:1px solid}
.alert.amber{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.alert.red{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.toggle{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--h)}
.actions{display:flex;gap:8px;align-items:center}
.primary{flex:1;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:12px;font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:13px;color:var(--muted)}
.ghost.danger{border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* hyrox scan */
.scan{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--h) 6%,var(--surface))}
.scan .hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scan .hdr b{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.filebtn{position:relative;overflow:hidden;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:8px;background:var(--sunk)}
.hitem{display:grid;grid-template-columns:1fr 110px auto;gap:6px}
.hsum{font-size:13px;color:var(--muted)}

/* plan grid */
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.pgrid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:3px}
.pgrid .h{font-size:10px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.05em;padding-bottom:2px}
.wkl{display:flex;flex-direction:column;justify-content:center;border-left:3px solid var(--pc);padding-left:5px;line-height:1.1}
.wkl b{font-family:var(--display);font-size:15px}
.wkl small{font-size:9px;color:var(--muted)}
.pc{border:0;border-radius:6px;min-height:40px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:color-mix(in srgb,var(--c) 14%,var(--surface));position:relative;font-size:10px;line-height:1.1}
.pc .k{font-family:var(--display);font-weight:700;font-size:13px;color:var(--c)}
.pc .v{color:var(--muted);font-size:9.5px}
.pc.rest{background:transparent;border:1px dashed var(--line)}
.pc.done{background:color-mix(in srgb,var(--c) 75%,#000)}.pc.done .k,.pc.done .v{color:#fff}
.pc.part{background:linear-gradient(135deg,var(--c) 50%,color-mix(in srgb,var(--c) 14%,var(--surface)) 50%)}
.pc.part .k{color:#fff}
.pc.miss{outline:2px solid var(--bad);outline-offset:-2px}
.pc.today{box-shadow:0 0 0 2px var(--fg)}
.pc.pre{opacity:.3}
.pc .rb{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px;background:var(--rc)}
.dl{font-size:9px;font-weight:700;color:var(--pc);letter-spacing:.03em}

/* reports */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.tile .big small{font-size:16px;color:var(--muted);font-weight:600}
.tile .cap{font-size:12px;color:var(--muted);margin-top:4px}
.sect{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:19px;text-transform:uppercase;font-weight:600}
.panel .hint{font-size:12px;color:var(--muted)}
svg text{font-family:var(--body)}
.chart{width:100%;height:auto;display:block}
.ax{fill:var(--muted);font-size:10px}
.grid{stroke:var(--line);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:104px 1fr 54px;align-items:center;gap:8px;font-size:13px}
.bar .tr{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--c);border-radius:99px}
.bar .pct{text-align:right;font-weight:600}
.cmp{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmp:last-child{border-bottom:0}
.cmp .q{font-weight:600;font-size:14px}
.cmp .v{font-size:12.5px;color:var(--muted)}
.cmp .v b{color:var(--fg)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:14px}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:6px}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--fg);font-weight:600}
.tests{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.tests div{background:var(--sunk);border-radius:10px;padding:10px 4px}
.tests b{display:block;font-family:var(--display);font-size:24px}
.tests small{font-size:11px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.ai{white-space:pre-wrap;font-size:14px;line-height:1.55}
.flags{display:flex;flex-direction:column;gap:6px;font-size:13px}
.flags div{display:flex;gap:8px;align-items:baseline}
.flags .pv{font-family:var(--display);font-weight:700;min-width:36px}

.rpill{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:12px;padding:10px 14px;font-size:14px}
.rpill>b{font-family:var(--display);font-size:28px;color:var(--vc);min-width:40px;text-align:center}
.rpill span:nth-child(2){flex:1}.rpill small{color:var(--muted);font-size:12px}
.macs{display:flex;flex-direction:column;gap:9px;padding:12px 16px 14px}
.mac .mh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.mac .mh b{font-size:15px}
.mac .tr{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}.mac .fl{height:100%;border-radius:99px}
.kpill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;color:var(--vc);border:1px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent)}
.meals{padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}
.mgrp{padding:6px 0}.mgh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.mgh b{font-family:var(--display);font-size:16px;color:var(--fg);letter-spacing:.04em}
.fitem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fn{font-weight:600;font-size:14px}.fq{font-size:12px;color:var(--muted)}
.fm{text-align:right;font-size:12.5px;line-height:1.3}.fm span{color:var(--muted)}
.est,.off{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;vertical-align:1px}
.est{background:var(--sunk);color:var(--muted)}.off{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.hgrid{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.hc{display:grid;grid-template-columns:repeat(28,1fr);gap:2px;min-width:0}
.hc i{aspect-ratio:1;border-radius:2px;background:transparent;border:1px solid var(--line);max-width:100%}
.hc i.off{background:var(--sunk);border-color:var(--sunk)}.hc i.on{background:var(--accent);border-color:var(--accent)}
.hp{font-weight:600;text-align:right;min-width:34px}
input[type=time]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font:inherit;color:var(--fg);min-width:0}
.nativefile{width:100%;font:inherit;font-size:14px;color:var(--muted)}
.nativefile::file-selector-button{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:9px;padding:10px 14px;margin-right:10px;cursor:pointer}
.tgrid{display:grid;grid-template-columns:1fr auto 84px;gap:6px 8px;align-items:center;padding:4px 0 12px;font-size:13px}
.tgrid small{color:var(--muted)}.tgrid input{padding:7px 8px}.tgrid select{padding:6px}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:10px;padding:3px}
.subtabs button{background:transparent;border:0;border-radius:8px;padding:8px 0;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.due{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);vertical-align:2px}
.plantrow{display:flex;gap:10px;align-items:baseline;padding:0 16px 14px;font-size:13px;color:var(--muted)}
.plantrow b{font-family:var(--display);font-size:24px;color:var(--e)}
.pmeals{display:flex;flex-direction:column;padding:0 16px 10px}
.pmeal{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.pmeal.done .pn{color:var(--muted);text-decoration:line-through}
.pmh{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pt{font-family:var(--display);font-weight:700;font-size:15px;color:var(--fg)}.ps{text-transform:uppercase;letter-spacing:.06em;font-weight:600}.pk{margin-left:auto}
.pn{font-weight:600;font-size:14.5px;min-width:0}.pi{grid-column:1/2;font-size:12.5px;color:var(--muted)}
.pl{grid-column:2;grid-row:2;font-size:12px;font-weight:700;color:var(--ok)}
.ate{grid-column:2;grid-row:2/4;padding:7px 12px!important;color:var(--fg)!important;border-color:var(--accent)!important}
.ptot{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;font-size:12.5px}
