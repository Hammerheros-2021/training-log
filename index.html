<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keel">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Keel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&family=JetBrains+Mono:wght@400&family=Sora:wght@600&display=swap">
<style>
html{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}

/* Layout: one narrow column, phone-first, deliberately dark: graphite greys with an orange accent. Sticky tab bar (Dashboard / Check-in / Training / Food / Reports); floating orange Dictate button on every tab. */
:root{
  --bg:#17191C; --surface:#212428; --sunk:#2B2F34; --line:#363B41;
  --fg:#EDEFF1; --muted:#99A1AA; --ink-inv:#FFFFFF;
  --accent:#F28C28; --on-accent:#1A1B1D;
  --s:#5B8DEF; --e:#7AC74F; --h:#3FB8AF; --t:#EE6363; --x:#B07CE0; --r:#6B747E; --o:#8C9BD0;
  --ok:#4CC27A; --warn:#E8C547; --bad:#EE6363; --farm:#C49A6C;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 12px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--sunk);border-radius:8px;padding:4px;gap:4px}
.tabs a{text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0;padding:8px 0;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.banner{background:var(--sunk);border-radius:8px;padding:12px 12px;font-size:13px;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.dnav{display:flex;align-items:center;gap:8px}
.dnav button{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:17px}
.dnav .mid{flex:1;text-align:center}
.dnav .mid b{display:block;font-family:var(--display);font-size:22px;font-weight:600}
.dnav .mid small{color:var(--muted);font-size:12px}
.todaybtn{font-size:12px!important;width:auto!important;padding:0 12px}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.strip button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 0 0;display:flex;flex-direction:column;align-items:center;gap:4px;overflow:hidden}
.strip button.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.strip .d{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.strip .n{font-family:var(--display);font-size:17px;font-weight:600}
.strip .rd{align-self:stretch;height:4px;margin-top:4px;background:var(--rc,transparent)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.done{background:var(--c)}
.dot.part{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.miss{border-color:var(--bad)}
.dot.rest{border-color:var(--line)}
.dot.pre{opacity:.25}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.shead{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 40%,#111));color:var(--ink-inv);padding:16px 16px 12px;display:flex;flex-direction:column;gap:4px}
.shead .meta{font-size:12px;opacity:.9;display:flex;gap:8px;flex-wrap:wrap}
.shead h2{font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05}
.shead .sub{font-size:13px;opacity:.95}
.chip{display:inline-block;padding:1px 8px;border-radius:9999px;background:rgba(255,255,255,.22);font-size:11px;font-weight:600;letter-spacing:.04em}
.sbody{padding:8px 16px 16px}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.ex:last-child{border-bottom:0}
.ex .tag{font-family:var(--display);font-weight:700;color:var(--c);font-size:16px;min-width:22px}
.ex .nm{font-weight:600;min-width:0}
.ex .cue{grid-column:2/4;font-size:12px;color:var(--muted)}
.ex .dose{font-family:var(--display);font-weight:600;font-size:17px;text-align:right}
.note{margin-top:12px;background:var(--sunk);border-radius:8px;padding:12px 12px;font-size:13px}
.note b{color:var(--c)}
details.wu{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:0 12px}
details.wu summary{padding:12px 0;font-weight:600;font-size:13px;cursor:pointer}
details.wu .ex{padding:8px 0}

/* check-in */
.chead{display:flex;align-items:center;gap:16px;padding:16px 16px;border-bottom:1px solid var(--line)}
.chead h2{font-size:22px;font-weight:700;text-transform:uppercase}
.chead .sub{font-size:13px;color:var(--muted)}
.gauge{flex:none;width:64px;height:64px;position:relative}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chips span{background:var(--sunk);border-radius:9999px;padding:4px 12px;font-size:12px}
.chips span b{font-weight:600}
.verdict{margin:0 16px 16px;border-radius:8px;padding:12px 12px;font-size:13px;border:1px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent)}
.verdict b{color:var(--vc)}
.group{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.group+.group{border-top:1px solid var(--line);padding-top:16px}
.group h4{margin:0;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags button{background:var(--sunk);border:1px solid transparent;border-radius:9999px;padding:8px 12px;font-size:13px}
.tags button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.nig{display:grid;grid-template-columns:1fr auto auto;gap:8px;background:var(--sunk);border-radius:8px;padding:8px}
.nig .full{grid-column:1/-1}
.nig .pr{display:flex;align-items:center;gap:8px}
.nig .pr input{flex:1;accent-color:var(--bad)}
.nig .pr output{font-family:var(--display);font-weight:700;min-width:40px;text-align:right}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;color:var(--fg);min-width:0}
.x{background:transparent;border:1px solid var(--line);border-radius:8px;width:36px;font-size:16px;color:var(--muted)}
.add{align-self:flex-start;background:transparent;border:1px dashed var(--muted);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--fg)}
.extra{display:grid;grid-template-columns:1fr 70px 70px auto;gap:8px;align-items:center}

/* forms */
.form{padding:16px 16px 16px;display:flex;flex-direction:column;gap:16px}
.form h3{font-size:22px;text-transform:uppercase;font-weight:600}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:8px 0;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg.status button[aria-pressed="true"][data-v="done"]{background:var(--ok);color:#fff}
.seg.status button[aria-pressed="true"][data-v="partial"]{background:var(--warn);color:var(--on-accent)}
.seg.status button[aria-pressed="true"][data-v="missed"]{background:var(--bad);color:#fff}
.seg.small button{font-size:12px;padding:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
input[type=number],input[type=text],textarea{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;color:var(--fg)}
textarea{min-height:64px;resize:vertical}
.alert{border-radius:8px;padding:12px 12px;font-size:13px;border:1px solid}
.alert.amber{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.alert.red{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.toggle{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:8px;padding:12px 12px;font-size:13px}
.toggle input{width:20px;height:20px;accent-color:var(--h)}
.actions{display:flex;gap:8px;align-items:center}
.primary{flex:1;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:12px;font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:12px 12px;font-size:13px;color:var(--muted)}
.ghost.danger{border-color:var(--bad);color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:9999px;font-size:13px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}

/* hyrox scan */
.scan{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px;background:color-mix(in srgb,var(--h) 6%,var(--surface))}
.scan .hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.scan .hdr b{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.filebtn{position:relative;overflow:hidden;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:8px;background:var(--sunk)}
.hitem{display:grid;grid-template-columns:1fr 110px auto;gap:8px}
.hsum{font-size:13px;color:var(--muted)}

/* plan grid */
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:8px;background:var(--c);margin-right:4px;vertical-align:-1px}
.pgrid{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px}
.pgrid .h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.05em;padding-bottom:4px}
.wkl{display:flex;flex-direction:column;justify-content:center;border-left:3px solid var(--pc);padding-left:4px;line-height:1.1}
.wkl b{font-family:var(--display);font-size:15px}
.wkl small{font-size:12px;color:var(--muted)}
.pc{border:0;border-radius:8px;min-height:40px;padding:4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:color-mix(in srgb,var(--c) 14%,var(--surface));position:relative;font-size:12px;line-height:1.1}
.pc .k{font-family:var(--display);font-weight:700;font-size:13px;color:var(--c)}
.pc .v{color:var(--muted);font-size:12px}
.pc.rest{background:transparent;border:1px dashed var(--line)}
.pc.done{background:color-mix(in srgb,var(--c) 75%,#000)}.pc.done .k,.pc.done .v{color:#fff}
.pc.part{background:linear-gradient(135deg,var(--c) 50%,color-mix(in srgb,var(--c) 14%,var(--surface)) 50%)}
.pc.part .k{color:#fff}
.pc.miss{outline:2px solid var(--bad);outline-offset:-2px}
.pc.today{box-shadow:0 0 0 2px var(--fg)}
.pc.pre{opacity:.3}
.pc .rb{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:8px;background:var(--rc)}
.dl{font-size:12px;font-weight:700;color:var(--pc);letter-spacing:.03em}

/* reports */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.tile .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.tile .big small{font-size:16px;color:var(--muted);font-weight:600}
.tile .cap{font-size:12px;color:var(--muted);margin-top:4px}
.sect{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:8px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:17px;text-transform:uppercase;font-weight:600}
.panel .hint{font-size:12px;color:var(--muted)}
svg text{font-family:var(--body)}
.chart{width:100%;height:auto;display:block}
.ax{fill:var(--muted);font-size:12px}
.grid{stroke:var(--line);stroke-width:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:104px 1fr 54px;align-items:center;gap:8px;font-size:13px}
.bar .tr{height:12px;background:var(--sunk);border-radius:9999px;overflow:hidden}
.bar .fl{height:100%;background:var(--c);border-radius:9999px}
.bar .pct{text-align:right;font-weight:600}
.cmp{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmp:last-child{border-bottom:0}
.cmp .q{font-weight:600;font-size:13px}
.cmp .v{font-size:12px;color:var(--muted)}
.cmp .v b{color:var(--fg)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
.empty h3{color:var(--fg);font-size:22px;margin-bottom:8px}
.sample{display:inline-flex;align-items:center;gap:8px;font-size:12px;padding:4px 12px;border-radius:9999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--fg);font-weight:600}
.tests{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.tests div{background:var(--sunk);border-radius:8px;padding:12px 4px}
.tests b{display:block;font-family:var(--display);font-size:22px}
.tests small{font-size:11px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.ai{white-space:pre-wrap;font-size:13px;line-height:1.55}
.flags{display:flex;flex-direction:column;gap:8px;font-size:13px}
.flags div{display:flex;gap:8px;align-items:baseline}
.flags .pv{font-family:var(--display);font-weight:700;min-width:36px}

.rpill{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--vc);border-radius:8px;padding:12px 16px;font-size:13px}
.rpill>b{font-family:var(--display);font-size:30px;color:var(--vc);min-width:40px;text-align:center}
.rpill span:nth-child(2){flex:1}.rpill small{color:var(--muted);font-size:12px}
.macs{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px}
.mac .mh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}.mac .mh b{font-size:15px}
.mac .tr{height:9px;background:var(--sunk);border-radius:9999px;overflow:hidden}.mac .fl{height:100%;border-radius:9999px}
.kpill{flex:none;font-size:12px;font-weight:700;padding:4px 12px;border-radius:9999px;color:var(--vc);border:1px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent)}
.meals{padding:0 16px 8px;display:flex;flex-direction:column;gap:8px}
.mgrp{padding:8px 0}.mgh{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 0}
.mgh b{font-family:var(--display);font-size:16px;color:var(--fg);letter-spacing:.04em}
.fitem{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fn{font-weight:600;font-size:13px}.fq{font-size:12px;color:var(--muted)}
.fm{text-align:right;font-size:12px;line-height:1.3}.fm span{color:var(--muted)}
.est,.off{font-size:12px;font-weight:700;padding:1px 8px;border-radius:9999px;vertical-align:1px}
.est{background:var(--sunk);color:var(--muted)}.off{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.hgrid{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:12px}
.hc{display:grid;grid-template-columns:repeat(28,1fr);gap:4px;min-width:0}
.hc i{aspect-ratio:1;border-radius:8px;background:transparent;border:1px solid var(--line);max-width:100%}
.hc i.off{background:var(--sunk);border-color:var(--sunk)}.hc i.on{background:var(--accent);border-color:var(--accent)}
.hp{font-weight:600;text-align:right;min-width:34px}
input[type=time]{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 8px;font:inherit;color:var(--fg);min-width:0}
.nativefile{width:100%;font:inherit;font-size:13px;color:var(--muted)}
.nativefile::file-selector-button{font:inherit;font-weight:600;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:12px 16px;margin-right:12px;cursor:pointer}
.tgrid{display:grid;grid-template-columns:1fr auto 84px;gap:8px 8px;align-items:center;padding:4px 0 12px;font-size:13px}
.tgrid small{color:var(--muted)}.tgrid input{padding:8px 8px}.tgrid select{padding:8px}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:8px;padding:4px}
.subtabs button{background:transparent;border:0;border-radius:8px;padding:8px 0;font-weight:600;font-size:13px;color:var(--muted);position:relative}
.subtabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.due{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);vertical-align:2px}
.plantrow{display:flex;gap:12px;align-items:baseline;padding:0 16px 16px;font-size:13px;color:var(--muted)}
.plantrow b{font-family:var(--display);font-size:22px;color:var(--e)}
.pmeals{display:flex;flex-direction:column;padding:0 16px 12px}
.pmeal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.pmeal.done .pn{color:var(--muted);text-decoration:line-through}
.pmh{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pt{font-family:var(--display);font-weight:700;font-size:15px;color:var(--fg)}.ps{text-transform:uppercase;letter-spacing:.06em;font-weight:600}.pk{margin-left:auto}
.pn{font-weight:600;font-size:15px;min-width:0}.pi{grid-column:1/2;font-size:12px;color:var(--muted)}
.pl{grid-column:2;grid-row:2;font-size:12px;font-weight:700;color:var(--ok)}
.ate{grid-column:2;grid-row:2/4;padding:8px 12px!important;color:var(--fg)!important;border-color:var(--accent)!important}

/* ================= Keel brand layer (from the Keel Brand Kit). Tokens only. ================= */
:root{
  --bg:#0B0C10; --surface:#15171E; --line:#262935;
  --text:#F4F5F8; --text-body:#D4D6DD; --text-muted:#9095A3; --on-text:#0B0C10;
  --fade-magenta:#E23D9E; --fade-blue:#5B6CFF; --fade-green:#34E3A0;
  --fade:linear-gradient(90deg,var(--fade-magenta),var(--fade-blue) 50%,var(--fade-green));
  --status-good:#34E3A0; --status-caution:#F2B84B; --status-alert:#FF6B6B;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-sm:8px; --radius-md:18px; --radius-lg:24px; --radius-full:9999px;
  --font-logo:Sora,system-ui,sans-serif;
  --font-display:"Inter Tight",Inter,system-ui,sans-serif;
  --font-body:Inter,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  /* old names mapped onto Keel tokens */
  --sunk:var(--bg); --fg:var(--text); --muted:var(--text-muted); --ink-inv:var(--text);
  --accent:var(--text); --on-accent:var(--on-text);
  --ok:var(--status-good); --warn:var(--status-caution); --bad:var(--status-alert);
  --s:var(--text-muted); --e:var(--text-muted); --h:var(--text-muted); --t:var(--text-muted); --x:var(--text-muted); --r:var(--line); --o:var(--text-muted); --farm:var(--text-muted);
  --display:var(--font-display); --body:var(--font-body);
}
html,body{background:var(--bg);color:var(--text);font:400 15px/22px var(--font-body)}
body{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{background:var(--bg)}
::selection{background:var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
button:disabled{opacity:.4}

/* type: four families, fixed jobs, sentence case */
h1,.gcard h1,.rphero h1{font:600 30px/36px var(--font-display);letter-spacing:-0.03em;text-transform:none}
h2,.chead h2,.shead h2,.hv h2,.cfsheet h2,.rhero h2,.lslide h2,.rih h2,.plbox h2,.mobhero h2,.gcard h2{font:600 22px/28px var(--font-display);letter-spacing:-0.02em;text-transform:none}
h3,.panel h3,.form h3,.setup h3,.todo h3,.rcat h3{font:600 16px/20px var(--font-body);letter-spacing:0;text-transform:none}
h4,.group h4,.sect,.mgh,.kgh,.pmt,.tbl th,.dl,.ps,.label,.popts>span,.pmsum .pslot,.tt small,.ring .rl small,.obprog span{font:500 12px/16px var(--font-body)!important;letter-spacing:.06em!important;text-transform:uppercase!important;color:var(--text-muted)}
.plmain h2,.plwrap2 .plmain h2{font:600 30px/36px var(--font-display);letter-spacing:-0.03em;text-transform:none}
.dtop b,.dmid b,.scan .hdr b,.vh b,.feat b,.choice b,.bigcta b,.rcard b,.plantop b,.msh b,.gbrand,.plhead span:first-child,.choice em,.gstep,.gnext,.howto i,.recl i{text-transform:none;letter-spacing:0}
.num,b.num,.big,.mid,.fnum b,.rstats b,.obsum b,.gauge b,.tile .big,.pc .k,.wkl b,.tests b,.flags .pv,.nig .pr output,.habs b,.mrv b,.recmeta b,.strip .n{font-family:var(--font-mono);font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums}
.big{font-size:17px;line-height:22px}
.ring .rl b,.plorb span,.plring b{font-family:var(--font-display);font-weight:600;letter-spacing:-0.04em;font-size:34px;line-height:1}
small,.ds,.sub,.hint,.gsub{font-size:13px;line-height:18px;color:var(--text-muted)}
p{color:var(--text-body)}

/* cards: surface on bg, no borders, no shadows, no coloured edges */
.card,.panel,article.card,.hero,.dt,.gcard,.todo,.rprog,.rcard,.setup,.bigcta,.mobhero,.rhero,.factions,.plantop,.pm,.stline{background:var(--surface)!important;border:0!important;border-radius:var(--radius-lg)!important;box-shadow:none!important;color:inherit}
.dt,.rprog,.rcard{border-radius:var(--radius-md)!important}
.hero,.panel{padding:var(--space-5)}
.shead{background:var(--surface)!important;color:var(--text)!important;padding:var(--space-5) var(--space-5) 0!important}
.shead small,.shead .sub{color:var(--text-muted)}
.chead{border-bottom:0!important}
.view{gap:var(--space-5)}
.note,.banner{background:var(--bg);color:var(--text-body);border-radius:var(--radius-sm)}
.alert{border-radius:var(--radius-sm)}
details.wu{border-color:var(--line);border-radius:var(--radius-sm)}

/* buttons: one white primary per screen, secondary outline, quiet text */
.primary,.donebtn,.rpgo .donebtn,#riGo{min-height:48px;background:var(--text)!important;color:var(--on-text)!important;border:0!important;border-radius:var(--radius-lg)!important;font:600 16px/20px var(--font-body)!important;letter-spacing:0!important;text-transform:none!important}
.ghost,.secondary{min-height:44px;background:transparent;border:1px solid var(--line);border-radius:var(--radius-lg);color:var(--text);font:600 16px/20px var(--font-body);text-transform:none}
.linkbtn{color:var(--text);min-height:44px;font-weight:600}
.x,.pli{min-width:44px;min-height:44px;border-radius:var(--radius-full)!important;border:1px solid var(--line);background:transparent;color:var(--text)}
.fab{background:var(--text)!important;color:var(--on-text)!important;font:600 16px/20px var(--font-body)!important;text-transform:none!important;letter-spacing:0!important;box-shadow:none!important;min-height:48px;border-radius:var(--radius-lg)!important}
.toast{background:var(--text);color:var(--on-text);font:600 15px/22px var(--font-body)}

/* segmented controls: track on bg, selected is the Sail fill */
.subtabs,.seg,.segmini{background:var(--surface);border:0;border-radius:var(--radius-lg);padding:var(--space-1);gap:var(--space-1)}
.card .subtabs,.card .seg,.card .segmini,.panel .seg,.gcard .seg,.rpage .subtabs,.cfsheet .seg,.cfsheet .subtabs,.vsheet .seg{background:var(--bg)}
.subtabs button,.seg button,.segmini button{min-height:44px;border-radius:var(--radius-lg)!important;font:500 15px/22px var(--font-body);color:var(--text-muted);background:transparent;border:0;text-transform:none;letter-spacing:0}
.subtabs button[aria-pressed="true"],.seg button[aria-pressed="true"],.segmini button[aria-pressed="true"]{background:var(--text)!important;color:var(--on-text)!important}
.tags button{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);min-height:44px;font:500 15px/22px var(--font-body);color:var(--text-body)}
.tags button[aria-pressed="true"]{background:var(--text);color:var(--on-text);border-color:var(--text)}
.chipx{background:var(--bg);color:var(--text-muted);border-radius:var(--radius-sm);font:400 13px/18px var(--font-mono);text-transform:uppercase}
.chipx.done{color:var(--status-good)}.chipx.todo{background:var(--bg)!important;color:var(--text-muted)!important}
input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text);font:400 15px/22px var(--font-body);min-height:44px}
.fbtn{background:var(--bg)!important;border:1px solid var(--line)!important;border-radius:var(--radius-md)!important;min-height:44px}
.frow .fbtn:first-child{border-color:var(--line)!important;background:var(--bg)!important}
.fbtn b{font:600 15px/22px var(--font-body)}

/* progress bars and rings: monochrome, track in line */
.prog,.tr,.plprog{background:var(--line)!important;border-radius:var(--radius-full)}
.prog i,.plprog i{background:var(--text)!important}
.fl{border-radius:var(--radius-full)}
.avatar{width:44px;height:44px;border-radius:var(--radius-full);background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--line);font:600 15px/1 var(--font-body)!important}

/* app header: wordmark left, profile button right */
.kbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) 0 var(--space-2);min-height:44px}
.kbar .kmark{display:block;height:34px;width:auto}
.kbar .kmark svg{height:34px;width:auto;display:block}

/* tab bar: four tabs, outline icons, no pills */
.tabs{grid-template-columns:repeat(4,minmax(0,1fr))!important;background:var(--bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-top:1px solid var(--line)!important;border-radius:0!important;padding:var(--space-3) var(--space-5) calc(var(--space-2) + env(safe-area-inset-bottom,0px))!important;gap:0!important}
.tabs a{display:flex!important;flex-direction:column;align-items:center;gap:var(--space-1);min-height:44px;padding:0!important;background:none!important;color:var(--text-muted)!important;font:500 11px/14px var(--font-body)!important;text-transform:none!important;letter-spacing:0!important;border-radius:0!important}
.tabs a svg{width:24px;height:24px}
.tabs a[aria-current="page"]{color:var(--text)!important;background:none!important}

/* icons that replaced emoji */
.ki{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.2em;flex-shrink:0}
.ki svg{width:100%;height:100%;display:block}
.rpic,.ric{color:var(--text)}

/* the Keel fade: logo, the balance ring, and at most one progress element per screen */
.kfade-bar{height:4px;border-radius:var(--radius-full);background:var(--fade)}

/* status colours always with a word or icon */
.ok,.good{color:var(--status-good)}
.gmark{margin-bottom:var(--space-4)}.gmark .kwm,.gbrand .kwm{height:34px;width:auto;display:block}
.kwm{height:34px;width:auto;display:block}

/* Today greeting and plan summary */
.dtop{align-items:flex-start!important;gap:var(--space-3)}
.kgreet h1{margin:0}.kgreet small{display:block;margin-top:var(--space-1)}
.heading{font:600 22px/28px var(--font-display);letter-spacing:-0.02em;color:var(--text)}
.data{font:400 13px/18px var(--font-mono);text-transform:uppercase;color:var(--text-muted)}
.kplan{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-5)!important}
.khead{display:flex;flex-direction:column;gap:var(--space-1)}
.kbody{margin:0;font:400 15px/22px var(--font-body);color:var(--text-body)}
.kfull{width:100%;min-height:48px}
.kprog{height:4px;border-radius:var(--radius-full);background:var(--line);overflow:hidden}.kprog i{display:block;height:100%;background:var(--fade)}
.krows{display:flex;flex-direction:column;gap:var(--space-3)}

.rcat h3{display:flex;align-items:center;gap:var(--space-2)}
.rcat h3::before{content:"";width:10px;height:10px;border-radius:var(--radius-full);background:var(--rc)}
.rcat .ric,.rprog[style*="--rc"] .ric{color:var(--rc)!important;background:color-mix(in srgb,var(--rc) 16%,var(--surface))!important}
.rcat .rgo,.rprog[style*="--rc"] .rgo{background:var(--rc)!important;color:var(--on-text)!important}
.rqgrid button{color:var(--text)}
.rqgrid button .ki{color:var(--rc)!important}
.rqgrid button{background:color-mix(in srgb,var(--rc) 10%,var(--bg))!important;border-color:color-mix(in srgb,var(--rc) 25%,transparent)!important}
.rqgrid button.on{background:color-mix(in srgb,var(--rc) 30%,var(--bg))!important;border-color:var(--rc)!important}
/* coming up: two by two */
.kup{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.kupi{flex-direction:row!important;align-items:center!important;gap:var(--space-3)!important}
.kud{min-width:36px}
.kun{flex:1;min-width:0}
.kname{grid-template-columns:1fr auto!important}.kname input{width:100%;margin-top:4px}.kedb{background:none;border:0;min-height:44px}

/* ================= New wordmark: the line wraps round the word, and draws itself while loading ================= */
.kbar .kmark,.kbar .kmark svg,.kbar .kwm{height:44px!important;width:auto}
.gmark .kwm,.gbrand .kwm{height:56px!important;width:auto}
.gload{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4)}
.gload .kwm{width:min(60vw,280px);height:auto!important}
.kwm .kl{stroke-dasharray:1 1;stroke-dashoffset:0}
.kloading .kwm .kl{animation:kdraw 1.8s cubic-bezier(.6,0,.3,1) infinite}
@keyframes kdraw{0%{stroke-dashoffset:1}75%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.kloading .kwm .kl{animation:none}}
[hidden]{display:none!important}
.kbar .kmark,.kbar .kmark svg,.kbar .kwm{height:40px!important}.kbar{gap:var(--space-2)}

/* greeting gets the full width */
.dtop{flex-wrap:wrap}.kgreet{flex:1 1 100%}

/* ================= v9: tighter greeting, macro rings that never overlap their text ================= */
.dtop{gap:var(--space-2)!important;align-items:center!important;flex-wrap:nowrap!important}
.kgreet{flex:1 1 auto!important;min-width:0}
.kgreet h1{font:600 22px/28px var(--font-display)!important;letter-spacing:-0.02em;margin:0}
.kgreet small{font-size:13px;line-height:18px;margin-top:2px!important}
.dtop #sampleBtn{min-height:36px!important;padding:0 var(--space-3)!important;font:600 13px/18px var(--font-body)!important;flex-shrink:0}
.dtop+.prog{margin-top:var(--space-2)!important}
.mrings{gap:var(--space-2)!important}
.mring{min-width:0}
.mring svg{width:100%;max-width:64px!important}
.mrv{max-width:64px!important}
.mrv b{font:400 15px/20px var(--font-mono)!important}
.mring>span{font:600 12px/16px var(--font-body)!important;color:var(--text)!important;text-align:center}
.mof{font:400 12px/16px var(--font-mono);color:var(--text-muted);text-align:center;white-space:nowrap}
.kgreet small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtop{padding-bottom:0!important;margin-bottom:0!important}
.dtop+.prog,.prog{margin-top:var(--space-2)!important;margin-bottom:0!important}
.dtop{position:relative;display:block!important}
.dtop #sampleBtn{position:absolute;right:0;bottom:4px;min-height:32px!important;padding:0 var(--space-3)!important;font:600 12px/16px var(--font-body)!important}
.kgreet small{padding-right:96px}
.view>.dtop+.prog{margin-top:calc(-1 * var(--space-3))!important}

/* prototype label under the logo, so it's obvious the app is still in development */
.kbar .kmark{display:flex!important;flex-direction:column;align-items:flex-start;gap:2px;text-decoration:none;min-height:44px;justify-content:center}
.kbar .kmark svg,.kbar .kwm{height:32px!important}
.kproto{display:inline-block;font:500 12px/16px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--status-caution);border:1px solid color-mix(in srgb,var(--status-caution) 45%,transparent);border-radius:var(--radius-sm);padding:0 6px}
.kbar .kproto{font-size:11px;line-height:14px;padding:0 5px;margin-left:2px}
.gmark{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)}
.gload .kproto{margin-top:calc(-1 * var(--space-2))}
/* prototype label: quiet, small, beside the logo */
.kbar .kmark{flex-direction:row!important;align-items:flex-end!important;gap:6px!important}
.kbar .kmark svg,.kbar .kwm{height:38px!important}
.kproto{border:0!important;padding:0!important;color:var(--text-muted)!important;font:500 11px/14px var(--font-body)!important;letter-spacing:.08em!important;text-transform:uppercase}
.kbar .kproto{margin:0 0 3px!important;opacity:.85}
.kbar .kmark{flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:0!important;flex-shrink:0!important}
.kbar .kmark svg,.kbar .kwm{height:31px!important}
.kbar .kproto{font-size:10px!important;line-height:12px!important;letter-spacing:.1em!important;margin:1px 0 0 3px!important}
.kghost{background:transparent!important;color:var(--text)!important;border:1px solid var(--line)!important}
</style>
</head>
